<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drivers Trips - Company Only</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,system-ui;background:#071a33;color:white}
header{padding:14px 6%;display:flex;justify-content:space-between;align-items:center;background:#071a33;border-bottom:3px solid #d4af62}
.logo-img{height:52px;width:auto;background:white;padding:5px 10px;border-radius:8px}
.login{max-width:380px;margin:80px auto;background:#0d2142;border:1px solid #d4af62;border-radius:14px;padding:24px;text-align:center}
.input-wrap{position:relative;margin:10px 0}
.input-wrap input{width:100%;padding:12px 42px 12px 12px;border-radius:8px;border:1px solid #1e3a5f;background:#071a33;color:white}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px;color:#d4af62;background:none;border:none}
button{width:100%;padding:12px;background:#d4af62;color:#071a33;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:6px}
.dash{display:none;padding:20px 6%}
.dash.show{display:block}
.trip{background:white;color:#071a33;border-radius:10px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
</style>
</head>
<body>
<header>
<img src="logo.png" class="logo-img" alt="logo">
<div style="color:#d4af62;font-weight:900;font-size:12px;letter-spacing:2px">COMPANY ONLY</div>
</header>

<div class="login" id="loginBox">
<h2 style="color:#d4af62">Drivers Trips Login</h2>
<p style="font-size:12px;color:#94a3b8;margin:8px 0">Company staff only - Hidden from users</p>

<div style="display:flex;align-items:center;gap:8px;margin:12px 0">
<input type="password" id="pass" placeholder="Company Password" style="flex:1;padding:12px;border-radius:8px;border:1px solid #1e3a5f;background:#071a33;color:white">
<button type="button" onclick="toggleEye()" id="eyeBtn" style="width:46px;height:46px;background:#d4af62;border:none;border-radius:8px;cursor:pointer;font-size:20px">👁️</button>
</div>
<button onclick="login()" style="width:100%;padding:12px;background:#d4af62;color:#071a33;border:none;border-radius:8px;font-weight:900;cursor:pointer">Access Dashboard</button>
<p style="font-size:11px;color:#475569;margin-top:10px">Password: Wellington2026</p>
</div>
<script>
function toggleEye(){
 let i=document.getElementById('pass');
 let e=document.getElementById('eyeBtn');
 if(i.type==='password'){ i.type='text'; e.textContent='🙈'; }
 else { i.type='password'; e.textContent='👁️'; }
}
</script>

<div class="dash" id="dash">
<div class="top">
<h1 style="color:#d4af62">🚛 Drivers Trips</h1>
<div>
<button onclick="addTrip()" style="width:auto;padding:10px 18px">+ Add Trip via Prompt</button>
<button onclick="logout()" style="width:auto;padding:10px 18px;background:transparent;border:1px solid #d4af62;color:#d4af62">Logout</button>
</div>
</div>
<div id="trips">
<div class="trip"><div><b>Trip #001 - Nairobi → Mombasa</b><br>Driver: John | KCA 123A | Client: 2BR KES 22,000 | Status: On Route</div><div><button onclick="promptStatus(this)" style="width:auto;padding:6px 12px;background:#071a33;color:white">Update Status via Prompt</button></div></div>
</div>
</div>

<script>
function toggleEye(){
 let i=document.getElementById('pass');
 let e=document.querySelector('.eye');
 if(i.type==='password'){ i.type='text'; e.textContent='🙈'; }
 else { i.type='password'; e.textContent='👁️'; }
}
function login(){
 let p=document.getElementById('pass').value;
 if(p==='Wellington2026' || p==='4050866'){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('dash').classList.add('show');
 } else alert('Wrong company password!');
}
function logout(){ location.reload(); }
function addTrip(){
 let route=prompt('Enter Route (e.g. Nairobi → Nakuru):'); if(!route) return;
 let driver=prompt('Enter Driver Name:');
 let client=prompt('Enter Client & Price:');
 let truck=prompt('Enter Truck Number:');
 let status=prompt('Enter Status (Loading / On Route / Completed):') || 'Loading';
 let div=document.createElement('div'); div.className='trip';
 div.innerHTML=`<div><b>Trip - ${route}</b><br>Driver: ${driver} | Truck ${truck} | Client: ${client} | Status: ${status}</div><div><button onclick="promptStatus(this)" style="width:auto;padding:6px 12px;background:#071a33;color:white">Update</button></div>`;
 document.getElementById('trips').prepend(div);
}
function promptStatus(btn){
 let s=prompt('Update status: Loading / On Route / Completed / Delayed');
 if(s) alert('Status updated to: '+s);
}
</script>
</body>
  </html>
